services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fightclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: fightclub
    ports: ['127.0.0.1:56432:5432']
    volumes: ['club_database:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fightclub']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  club_database:
