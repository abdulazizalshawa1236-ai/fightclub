name: fightclub-production
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE to an absolute private host env file}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE}
    environment:
      NODE_ENV: production
      PORT: 4100
      TRUST_PROXY: '1'
      MEDIA_STORAGE: s3
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4100/api/public/site').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    command: [node, apps/api/dist/operations/worker.js]
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE}
    environment:
      NODE_ENV: production
      MEDIA_STORAGE: s3
    depends_on:
      db:
        condition: service_healthy
  migrate:
    profiles: [tools]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: build
    command: [npm, run, db:migrate]
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE}
    environment:
      NODE_ENV: production
      MEDIA_STORAGE: s3
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:4100
      PORT: 3100
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CLUB_DOMAIN: ${CLUB_DOMAIN:?Set CLUB_DOMAIN to the real DNS hostname}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL to the certificate administrator email}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
volumes:
  database:
  certificates:
  caddy_config:
