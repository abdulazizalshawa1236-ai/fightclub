services:
  fightclub:
    build: .
    container_name: fightclub
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - fightclub_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  fightclub_data:
